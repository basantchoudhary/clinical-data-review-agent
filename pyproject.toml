[project]
name = "clinical-review"
version = "0.1.0"
description = "Reviews one clinical-trial patient across forms and drafts queries for a data manager to approve (AG-102)."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
# The model adapter imports the SDK only when it is used.
claude = ["anthropic>=2.3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
